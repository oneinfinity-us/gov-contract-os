[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gov-contract-os"
version = "0.1.0"
description = "Government/municipal procurement opportunity discovery, scoring, and analysis automation."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "SQLAlchemy>=2.0",
  "typer>=0.12",
  "tenacity>=8.2",
  "python-dateutil>=2.9",
  "defusedxml>=0.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "respx>=0.21",
]

[project.scripts]
gov-contract-os = "gov_contract_os.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gov_contract_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
